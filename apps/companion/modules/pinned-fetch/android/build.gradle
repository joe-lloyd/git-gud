// Expo SDK 53 local module: the expo-module-gradle-plugin supplies compileSdk /
// minSdk / kotlin config from the root project, so nothing else is declared here.
apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.pinnedfetch'
version = '0.1.0'

android {
  namespace "expo.modules.pinnedfetch"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
