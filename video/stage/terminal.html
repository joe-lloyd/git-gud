<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Terminal</title>
<style>
  html, body { margin: 0; height: 100%; background: radial-gradient(1200px 700px at 30% 20%, #2a1530, #0d1117 70%); font-family: -apple-system, sans-serif; }
  .window { position: absolute; inset: 48px 64px; border-radius: 14px; background: #0d1117; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06); overflow: hidden; display: flex; flex-direction: column; }
  .bar { height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: #1a2030; color: #9a96a8; font-size: 13px; flex: none; }
  .dot { width: 12px; height: 12px; border-radius: 50%; } .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .title { flex: 1; text-align: center; margin-right: 52px; }
  pre { margin: 0; padding: 18px 22px; flex: 1; overflow: hidden; font: 19px/1.4 "SF Mono", Menlo, monospace; color: #dcddde; white-space: pre; }
  .prompt { color: #ff4fc3; } .cmd { color: #fff; }
  .caret { display: inline-block; width: 9px; height: 18px; background: #ff4fc3; vertical-align: -3px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .w { background: #fff; } .fk { color: #000; } .fw { color: #fff; }
  .hl { color: #68d391; }
  canvas.qr { display: block; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="window">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title" id="title">build-box — zsh</span></div>
  <pre id="out"></pre>
</div>
<script>
  const out = document.getElementById("out");
  const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  // Renders the four ANSI codes the daemon's QR code uses: white background, black or white text, reset.
  function ansi(text) {
    let html = "", open = 0;
    for (const part of text.split(/(\x1b\[[0-9;]*m)/)) {
      const m = /^\x1b\[([0-9;]*)m$/.exec(part);
      if (!m) { html += esc(part); continue; }
      const code = m[1];
      if (code === "0" || code === "") { html += "</span>".repeat(open); open = 0; }
      else { html += `<span class="${code === "47" ? "w" : code === "30" ? "fk" : code === "37" ? "fw" : ""}">`; open++; }
    }
    return html + "</span>".repeat(open);
  }
  // A QR row as text leaves gaps between lines, so draw it: each character is two modules, top and bottom.
  const MODULE = 7;
  function qrRow(line) {
    const cells = [];
    // No color codes means the terminal's own colors: light blocks on the dark background.
    const TEXT = "#f0f4f8";
    let bg = null, fg = TEXT;
    for (const part of line.split(/(\x1b\[[0-9;]*m)/)) {
      const m = /^\x1b\[([0-9;]*)m$/.exec(part);
      if (m) {
        if (m[1] === "0" || m[1] === "") { bg = null; fg = TEXT; }
        else if (m[1] === "47") bg = "#fff"; else if (m[1] === "40") bg = "#000";
        else if (m[1] === "30") fg = "#000"; else if (m[1] === "37") fg = "#fff";
        continue;
      }
      for (const ch of part) cells.push(ch === "█" ? [fg, fg] : ch === "▀" ? [fg, bg] : ch === "▄" ? [bg, fg] : [bg, bg]);
    }
    const canvas = document.createElement("canvas");
    canvas.className = "qr";
    canvas.width = cells.length * MODULE;
    canvas.height = 2 * MODULE;
    const g = canvas.getContext("2d");
    cells.forEach(([top, bottom], x) => {
      if (top) { g.fillStyle = top; g.fillRect(x * MODULE, 0, MODULE, MODULE); }
      if (bottom) { g.fillStyle = bottom; g.fillRect(x * MODULE, MODULE, MODULE, MODULE); }
    });
    return canvas;
  }
  let caret;
  function prompt() { caret?.remove(); out.insertAdjacentHTML("beforeend", '<span class="prompt">~ ❯ </span>'); caret = document.createElement("span"); caret.className = "caret"; out.appendChild(caret); }
  window.term = {
    title: (t) => { document.getElementById("title").textContent = t; },
    clear: () => { out.innerHTML = ""; prompt(); },
    async type(cmd, ms = 38) {
      const span = document.createElement("span"); span.className = "cmd"; out.insertBefore(span, caret);
      for (const ch of cmd) { span.textContent += ch; await new Promise((r) => setTimeout(r, ms)); }
    },
    async print(text, lineMs = 0) {
      caret?.remove(); out.insertAdjacentHTML("beforeend", "\n");
      for (const line of text.replace(/\n$/, "").split("\n")) {
        if (/[▀▄█]/.test(line)) out.appendChild(qrRow(line));
        else out.insertAdjacentHTML("beforeend", ansi(line) + "\n");
        if (lineMs) await new Promise((r) => setTimeout(r, lineMs));
      }
    },
    prompt,
  };
  prompt();
</script>
</body>
</html>
