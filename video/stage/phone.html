<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phone</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: radial-gradient(1100px 700px at 70% 30%, #2a1530, #0d1117 70%); font-family: -apple-system, sans-serif; color: #dcddde; }
  .phone { position: absolute; left: 240px; top: 26px; width: 380px; height: 758px; border-radius: 52px; background: #0b0b0e; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 2px #3a3744 inset; padding: 12px; box-sizing: border-box; }
  .screen { width: 356px; height: 734px; border-radius: 42px; overflow: hidden; background: #14151c; position: relative; }
  iframe { border: 0; width: 356px; height: 734px; display: block; }
  .side { position: absolute; left: 720px; top: 250px; width: 520px; }
  .kicker { font: 600 13px/1 -apple-system, sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #ff4fc3; }
  h1 { font-size: 46px; line-height: 1.1; margin: 12px 0 14px; color: #fff; letter-spacing: -0.02em; }
  p { font-size: 20px; line-height: 1.5; color: #a9a6b4; margin: 0; }
  .note { margin-top: 26px; font-size: 14px; color: #77748a; }
</style>
</head>
<body>
  <div class="phone"><div class="screen"><iframe id="app" title="Git Gud companion"></iframe></div></div>
  <div class="side">
    <div class="kicker">Git Gud companion</div>
    <h1 id="heading">Your repositories, on your phone</h1>
    <p id="text">Pair it with any machine running Git Gud or gitgud-headless.</p>
    <div class="note">Recorded from the app's web build. Android and iOS run the same screens.</div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById("app").src = params.get("app");
    window.stage = { say(heading, text) { document.getElementById("heading").textContent = heading; document.getElementById("text").textContent = text; } };
  </script>
</body>
</html>
