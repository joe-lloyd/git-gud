name: Release

# Tag-driven release. Push a `v*` tag (e.g. `v0.2.0`) and this builds the
# installers and uploads them to a GitHub Release. electron-updater clients
# poll that release, so users get the new build in-app.
#
# Workflow: bump `version` in package.json → commit → `git tag v0.2.0` →
#           `git push --follow-tags`. CI takes it from there.
on:
  push:
    tags:
      - 'v*'
  # Re-run only the companion APK + release-notes tidy for an existing release
  # (the desktop installers are not rebuilt — re-publishing them would 422 on
  # the existing blockmaps). Builds from the dispatched ref (normally main).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the APK to (e.g. v1.14.0)'
        required: true

permissions:
  contents: write  # needed for electron-builder to create the GitHub Release

# Tags with a prerelease suffix (v1.11.0-dev.0, from `pnpm release:dev`) are
# published as GitHub *pre-releases*: the "latest" feed the Stable update
# channel reads skips them; only installs switched to the Dev channel
# (Settings → Updates) receive them. electron-builder reads EP_PRE_RELEASE.
env:
  EP_PRE_RELEASE: ${{ contains(github.ref_name, '-') }}

jobs:
  build:
    name: Build (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" so local and CI use
      # the same pnpm. Pinning v9 here broke on the pnpm-10 workspace config.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build app bundles
        run: pnpm build

      # No icon-render step here: resources/icon.png (1024×1024) is committed
      # and every platform's icon — including the macOS .icns — is generated
      # from it by electron-builder at package time. Regenerate the PNG locally
      # with `pnpm build:icon` when the SVG changes (it needs the Electron
      # binary, which --ignore-scripts intentionally skips in CI).

      - name: Package + publish
        env:
          # electron-builder reads this to attach artifacts to the GitHub
          # Release. Auto-provided in CI, no secret config needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  # Runs after all three platform builds have published to the *draft*
  # release. Removes blockmaps no
  # updater path reads (dmg blockmaps — mac updates ship as zip; mac zip
  # blockmaps — the custom MacUpdater full-downloads, it never does
  # differential) and writes a download guide as the release notes so people
  # can tell the four real installers from updater plumbing. The Windows
  # Setup-*.exe.blockmap stays: electron-updater uses it for differential
  # updates on Windows.
  # Single-file Linux daemon (src/headless). Built once on ubuntu, smoke-run,
  # uploaded next to the installers with a sha256 the install script checks.
  headless:
    name: Build headless daemon
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build:headless && pnpm build:relay
      - name: Smoke test
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(node out/headless/main.js --version)" = "$VERSION"
          export GITGUD_HEADLESS_HOME=$(mktemp -d)
          node out/headless/main.js init --repo "$PWD"
          node out/headless/main.js serve & PID=$!
          sleep 3
          curl -sk https://127.0.0.1:47831/gitgud/info | grep -q '"platform":"linux-headless"'
          node out/headless/main.js status | grep -q '"readOnly": true'
          node out/headless/main.js pair | grep -q 'Pairing code'
          kill $PID
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cp out/headless/main.js "gitgud-headless-${VERSION}.js"
          sha256sum "gitgud-headless-${VERSION}.js" > "gitgud-headless-${VERSION}.js.sha256"
          cp out/relay/main.js "gitgud-relay-${VERSION}.js"
          sha256sum "gitgud-relay-${VERSION}.js" > "gitgud-relay-${VERSION}.js.sha256"
          test "$(node out/relay/main.js --version)" = "$VERSION"
          # The release is created by the electron-builder jobs; wait for it.
          for i in $(seq 1 30); do gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$GITHUB_REF_NAME" "gitgud-headless-${VERSION}.js" "gitgud-headless-${VERSION}.js.sha256" "gitgud-relay-${VERSION}.js" "gitgud-relay-${VERSION}.js.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  # Android build of the read-only companion app (apps/companion, Expo). The
  # APK is uploaded next to the installers, plus a PNG QR code of its download
  # URL so the release notes can be scanned from a phone to sideload it.
  # Signing: if the COMPANION_KEYSTORE_* secrets exist the release is signed
  # with that keystore; otherwise the React Native template's public
  # debug.keystore is used (stable across builds, so upgrades install over each
  # other — but anyone could sign an APK with it, so treat it as a test build).
  companion-android:
    name: Build companion (Android APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # Version + provenance stamp. `extra.build` is what the app shows in its
      # footer (tag + sha) for both the APK and any OTA JS update, so every
      # running combination is traceable. With EXPO_PROJECT_ID set, OTA
      # updates are enabled and pointed at that EAS Update project.
      - name: Stamp version, build info and OTA config
        working-directory: apps/companion
        env:
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          node -e '
            const fs = require("fs");
            const [version, sha, projectId] = process.argv.slice(1);
            const [maj, min, pat] = version.split("-")[0].split(".").map(Number);
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.version = version;
            a.expo.android.versionCode = maj * 1000000 + min * 1000 + pat;
            a.expo.extra = { ...(a.expo.extra || {}), build: { tag: "v" + version, sha } };
            if (projectId) {
              a.expo.extra.eas = { projectId };
              a.expo.updates = { ...(a.expo.updates || {}), enabled: true, url: "https://u.expo.dev/" + projectId };
            }
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2) + "\n");
            console.log("companion", a.expo.version, "versionCode", a.expo.android.versionCode, "ota", a.expo.updates.enabled, "sha", sha);
          ' "$VERSION" "$GITHUB_SHA" "${EXPO_PROJECT_ID:-}"
      - name: Generate native project
        working-directory: apps/companion
        env:
          CI: 1
        run: pnpm exec expo prebuild --platform android --no-install --clean
      - name: Configure release signing (optional)
        working-directory: apps/companion
        env:
          COMPANION_KEYSTORE_B64: ${{ secrets.COMPANION_KEYSTORE_B64 }}
          COMPANION_KEYSTORE_PASSWORD: ${{ secrets.COMPANION_KEYSTORE_PASSWORD }}
          COMPANION_KEY_ALIAS: ${{ secrets.COMPANION_KEY_ALIAS }}
          COMPANION_KEY_PASSWORD: ${{ secrets.COMPANION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${COMPANION_KEYSTORE_B64:-}" ]; then
            echo "$COMPANION_KEYSTORE_B64" | base64 -d > android/app/release.keystore
            export COMPANION_KEYSTORE_FILE=release.keystore
          fi
          node ../../scripts/companion-android-signing.mjs android/app/build.gradle
      - name: Build APK
        working-directory: apps/companion/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      # OTA: publish this JS to EAS Update so phones on a compatible native
      # build (same fingerprint) update without a new APK. Skipped without
      # the secrets — the APK alone still ships.
      - name: Publish OTA JS update (EAS Update)
        working-directory: apps/companion
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
        run: |
          set -euo pipefail
          # `secrets` cannot be used in `if:` — decide here instead.
          if [ -z "${EXPO_TOKEN:-}" ] || [ -z "${EXPO_PROJECT_ID:-}" ]; then echo "EXPO_TOKEN / EXPO_PROJECT_ID not set — skipping OTA publish (APK only)"; exit 0; fi
          BRANCH=production; [[ "$TAG" == *-* ]] && BRANCH=dev
          pnpm dlx eas-cli@latest update --branch "$BRANCH" --message "$TAG ($GITHUB_SHA)" --non-interactive --json | tee eas-update.json
          node -e 'const u=JSON.parse(require("fs").readFileSync("eas-update.json","utf8"));for(const x of [].concat(u))console.log("published",x.platform,x.runtimeVersion,x.id)' || true
      - name: Upload APK + QR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          APK="Git-Gud-Companion-${VERSION}.apk"
          cp apps/companion/android/app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          pnpm qr:png "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK}" "companion-qr-${VERSION}.png"
          for i in $(seq 1 30); do gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" "$APK" "$APK.sha256" "companion-qr-${VERSION}.png" --repo "$GITHUB_REPOSITORY" --clobber

  tidy-release:
    name: Tidy release assets
    needs: [build, headless, companion-android]
    # The APK build is the slowest and most fragile job; still write the notes
    # if it fails (the companion row is only added when the asset exists).
    if: ${{ !cancelled() && contains(fromJSON('["success","skipped"]'), needs.build.result) && contains(fromJSON('["success","skipped"]'), needs.headless.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete unused blockmaps + write download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for asset in $(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'); do
            case "$asset" in
              *.dmg.blockmap|*mac.zip.blockmap)
                echo "deleting $asset"
                gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
                ;;
            esac
          done
          COMPANION=""
          if gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name' | grep -qx "Git-Gud-Companion-${VERSION}.apk"; then
            COMPANION="| Android companion app | \`Git-Gud-Companion-${VERSION}.apk\` (+ \`.sha256\`) — or scan the QR below |"
            COMPANION_QR="
          ### Companion app (Android)

          Scan with your phone to download and sideload the read-only companion app (allow *install unknown apps* for your browser when prompted). Then open it and scan the pairing QR from Git Gud → Peers → **Show QR** (or \`gitgud-headless pair --qr\`).

          ![Install the Git Gud companion APK](https://github.com/${REPO}/releases/download/${TAG}/companion-qr-${VERSION}.png)

          The APK is signed with the public React Native debug key unless the repo has \`COMPANION_KEYSTORE_*\` secrets — fine for your own phone, not a store build.
          "
          else
            COMPANION_QR=""
          fi
          DEV_NOTE=""
          if [[ "$VERSION" == *-* ]]; then
            DEV_NOTE="> **Dev build** — a pre-release for testing. Installs on the Stable update channel never see it; switch to **Dev** in Settings → Updates to receive dev builds automatically. To return to stable, pick Stable again — you move over at the next stable release (the app never downgrades).

          "
          fi
          gh release edit "$TAG" --repo "$REPO" --notes "${DEV_NOTE}## Downloads

          | Platform | File |
          | --- | --- |
          | macOS — Apple Silicon | \`Git-Gud-${VERSION}-arm64.dmg\` |
          | macOS — Intel | \`Git-Gud-${VERSION}.dmg\` |
          | Windows | \`Git-Gud-Setup-${VERSION}.exe\` |
          | Linux | \`Git-Gud-${VERSION}.AppImage\` |
          | Linux headless daemon | \`gitgud-headless-${VERSION}.js\` (+ \`.sha256\`) — \`curl -fsSL https://raw.githubusercontent.com/joe-lloyd/git-gud/main/scripts/install-headless.sh | bash\` |
          | Rendezvous/relay service | \`gitgud-relay-${VERSION}.js\` (+ \`.sha256\`) — see docs/relay.md |
          ${COMPANION}
          ${COMPANION_QR}
          ### macOS first launch

          The app is unsigned, so a browser-downloaded DMG makes Gatekeeper claim the app is \"damaged\" (right-click → Open does **not** clear that dialog — that trick only works for the *unidentified developer* one). Two ways around it:

          **Skip the browser** — paste this in Terminal; it downloads the right build for your Mac without the quarantine flag browsers add, so the dialog never appears:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/joe-lloyd/git-gud/main/scripts/install-macos.sh | bash
          \`\`\`

          **Or clear the flag once** after dragging the app out of the DMG into Applications:

          \`\`\`sh
          xattr -dr com.apple.quarantine \"/Applications/Git Gud.app\"
          \`\`\`

          Full walkthrough: https://joe-lloyd.github.io/git-gud/install/macos — updates are unaffected either way; the in-app updater downloads directly, so it never re-triggers Gatekeeper.

          All other files (\`.zip\`, \`latest-*.yml\`, \`.blockmap\`) belong to the in-app auto-updater — no need to download them."
          # Everything is uploaded: make the release visible. Only now does it
          # become "latest" for the updaters (drafts are invisible to them).
          if [[ "$VERSION" == *-* ]]; then
            gh release edit "$TAG" --repo "$REPO" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$REPO" --draft=false --latest
          fi
