name: Release

# Tag-driven release. Push a `v*` tag (e.g. `v0.2.0`) and this builds the
# installers and uploads them to a GitHub Release. electron-updater clients
# poll that release, so users get the new build in-app.
#
# Workflow: bump `version` in package.json → commit → `git tag v0.2.0` →
#           `git push --follow-tags`. CI takes it from there.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write  # needed for electron-builder to create the GitHub Release

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager" so local and CI use
      # the same pnpm. Pinning v9 here broke on the pnpm-10 workspace config.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build app bundles
        run: pnpm build

      # No icon-render step here: resources/icon.png (1024×1024) is committed
      # and every platform's icon — including the macOS .icns — is generated
      # from it by electron-builder at package time. Regenerate the PNG locally
      # with `pnpm build:icon` when the SVG changes (it needs the Electron
      # binary, which --ignore-scripts intentionally skips in CI).

      - name: Package + publish
        env:
          # electron-builder reads this to attach artifacts to the GitHub
          # Release. Auto-provided in CI, no secret config needed.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

  # Runs after all three platform builds have published. Removes blockmaps no
  # updater path reads (dmg blockmaps — mac updates ship as zip; mac zip
  # blockmaps — the custom MacUpdater full-downloads, it never does
  # differential) and writes a download guide as the release notes so people
  # can tell the four real installers from updater plumbing. The Windows
  # Setup-*.exe.blockmap stays: electron-updater uses it for differential
  # updates on Windows.
  tidy-release:
    name: Tidy release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete unused blockmaps + write download guide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          for asset in $(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name'); do
            case "$asset" in
              *.dmg.blockmap|*mac.zip.blockmap)
                echo "deleting $asset"
                gh release delete-asset "$TAG" "$asset" --repo "$REPO" --yes
                ;;
            esac
          done
          gh release edit "$TAG" --repo "$REPO" --notes "## Downloads

          | Platform | File |
          | --- | --- |
          | macOS — Apple Silicon | \`Git-Gud-${VERSION}-arm64.dmg\` |
          | macOS — Intel | \`Git-Gud-${VERSION}.dmg\` |
          | Windows | \`Git-Gud-Setup-${VERSION}.exe\` |
          | Linux | \`Git-Gud-${VERSION}.AppImage\` |

          macOS is unsigned: on first launch, right-click the app → Open.

          All other files (\`.zip\`, \`latest-*.yml\`, \`.blockmap\`) belong to the in-app auto-updater — no need to download them."
